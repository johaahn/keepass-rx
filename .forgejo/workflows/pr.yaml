name: PR CI

on:
  pull_request:

jobs:
  clickable:
    name: Clickable amd64
    runs-on: docker-large
    container:
      image: git.agnos.is/projectmoon/livewire-ci:clickable-amd64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App
        run: clickable build --arch amd64

  sfos:
    name: SFOS aarch64
    runs-on: docker-large
    timeout-minutes: 360
    container:
      image: git.agnos.is/projectmoon/livewire-ci:sfos-aarch64
    steps:
      - name: Own Workspace
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install License Generator
        shell: bash
        run: |
          sdk-manage tooling maintain SailfishOS-$SFOS_VERSION \
              cargo install --locked --root /usr --version 0.8.2 cargo-about
          cp /srv/mer/toolings/SailfishOS-$SFOS_VERSION/usr/bin/cargo-about \
              /srv/mer/targets/SailfishOS-$SFOS_VERSION-$SFOS_ARCH/usr/bin/cargo-about

      - name: Build RPM
        shell: bash
        run: |
          version="$(git describe --tags --always | sed -e 's/^v//' -e 's/[^A-Za-z0-9.]/./g')"
          sudo ln -sfn "$GITHUB_WORKSPACE" /src
          sudo mkdir -p /out
          KEEPASSRX_VERSION="$version" bash sfos/docker-entrypoint.sh aarch64

  unit-tests:
    name: Unit Tests
    runs-on: docker-large
    container:
      image: git.agnos.is/projectmoon/livewire-ci:clickable-amd64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: mkdir -p build/x86_64-linux-gnu/app && clickable test --arch amd64

  license-check:
    name: License Check
    runs-on: docker
    container:
      image: git.agnos.is/projectmoon/livewire-ci:rust
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: License Check
        run: cargo deny check licenses
